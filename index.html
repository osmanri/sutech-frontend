<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">АгроБот — Экономия воды</title>
  <meta id="pageDesc" name="description" content="Умная система управления поливом для фермеров" />

  <!-- Telegram Mini App SDK — подключать ПЕРВЫМ -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ── Кастомные анимации ─────────────────────────────────────────── */

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33%       { transform: translateY(-8px) rotate(1deg); }
      66%       { transform: translateY(-4px) rotate(-1deg); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0),
                    0 8px 32px rgba(34, 197, 94, 0.25);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(34, 197, 94, 0.08),
                    0 8px 48px rgba(34, 197, 94, 0.45);
      }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }

    /* ── Базовые стили ──────────────────────────────────────────────── */

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #052e16; /* green-950 */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Иконка: плавающая анимация ─────────────────────────────────── */
    .icon-float { animation: float 5s ease-in-out infinite; }

    /* ── Карточки: постепенное появление ───────────────────────────── */
    .fade-up-1 { animation: fade-up 0.5s ease-out 0.1s both; }
    .fade-up-2 { animation: fade-up 0.5s ease-out 0.25s both; }
    .fade-up-3 { animation: fade-up 0.5s ease-out 0.4s both; }
    .fade-up-4 { animation: fade-up 0.5s ease-out 0.55s both; }
    .fade-up-5 { animation: fade-up 0.5s ease-out 0.7s both; }

    /* ── Кнопка: пульсирующее свечение ─────────────────────────────── */
    .btn-pulse  { animation: pulse-glow 2.5s ease-in-out infinite; }
    .btn-loading {
      background: linear-gradient(
        90deg,
        #166534 0%, #16a34a 40%, #166534 60%, #166534 100%
      );
      background-size: 200% auto;
      animation: shimmer 1.5s linear infinite;
      opacity: 0.85;
      cursor: not-allowed;
    }

    /* ── Статус-блок ────────────────────────────────────────────────── */
    .status-block {
      width: 100%;
      border-radius: 1rem;
      padding: 0.875rem 1rem;
      text-align: center;
    }
    .status-loading { background: rgba(20, 83, 45, 0.5);  border: 1px solid rgba(34,197,94,0.2); }
    .status-success { background: rgba(20, 83, 45, 0.7);  border: 1px solid rgba(34,197,94,0.4); }
    .status-error   { background: rgba(127, 29, 29, 0.3); border: 1px solid rgba(239,68,68,0.3); }

    /* ── Декоративные круги на фоне ─────────────────────────────────── */
    .bg-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body class="flex items-start justify-center min-h-full px-5 py-8 overflow-x-hidden">

  <!-- Фоновые декоративные элементы -->
  <div class="bg-orb w-72 h-72 bg-green-800 opacity-20 top-[-80px] right-[-60px]"></div>
  <div class="bg-orb w-96 h-96 bg-green-900 opacity-30 bottom-[-100px] left-[-80px]"></div>

  <!-- Основной контейнер -->
  <main class="relative z-10 w-full max-w-sm flex flex-col items-center gap-6">

    <!-- ── Иконка ──────────────────────────────────────────────────── -->
    <div class="icon-float fade-up-1 mt-2">
      <div class="w-24 h-24 rounded-3xl flex items-center justify-center"
           style="background: linear-gradient(135deg, #14532d 0%, #166534 100%);
                  box-shadow: 0 4px 24px rgba(34,197,94,0.2), inset 0 1px 0 rgba(255,255,255,0.07);">
        <!-- SVG: капля воды с листом -->
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Капля -->
          <path d="M26 4 C26 4 10 22 10 33 C10 42.4 17.2 48 26 48
                   C34.8 48 42 42.4 42 33 C42 22 26 4 26 4Z"
                fill="#22c55e" opacity="0.95"/>
          <!-- Блик на капле -->
          <ellipse cx="20" cy="26" rx="4" ry="6"
                   fill="white" opacity="0.15" transform="rotate(-20 20 26)"/>
          <!-- Листик внутри -->
          <path d="M26 38 C26 38 18 30 22 22 C26 30 34 22 34 22
                   C30 30 26 38 26 38Z"
                fill="#14532d" opacity="0.8"/>
          <!-- Прожилка листа -->
          <line x1="26" y1="38" x2="26" y2="22"
                stroke="#dcfce7" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>
    </div>

    <!-- ── Заголовок ───────────────────────────────────────────────── -->
    <div class="fade-up-2 text-center flex flex-col gap-2">
      <h1 class="text-3xl font-bold tracking-tight"
          style="color: #f0fdf4; letter-spacing: -0.5px;">
        АгроБот
      </h1>
      <p id="subtitle" class="text-sm leading-relaxed" style="color: #86efac;">
        Умная система управления поливом.<br>
        Экономьте воду с первой минуты.
      </p>
    </div>

    <!-- ── Шаги инструкции ─────────────────────────────────────────── -->
    <div class="fade-up-3 w-full rounded-2xl p-4 flex flex-col gap-3"
         style="background: rgba(20,83,45,0.4); border: 1px solid rgba(34,197,94,0.15);">
      <p id="howToStart" class="text-xs font-semibold uppercase tracking-wider" style="color:#4ade80;">
        Как начать
      </p>

      <div class="flex items-center gap-3">
        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
              style="background:rgba(34,197,94,0.15); color:#4ade80;">1</span>
        <span id="step1" class="text-sm" style="color:#bbf7d0;">Нажмите кнопку ниже</span>
      </div>

      <div class="flex items-center gap-3">
        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
              style="background:rgba(34,197,94,0.15); color:#4ade80;">2</span>
        <span id="step2" class="text-sm" style="color:#bbf7d0;">Разрешите доступ к геолокации</span>
      </div>

      <div class="flex items-center gap-3">
        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
              style="background:rgba(34,197,94,0.15); color:#4ade80;">3</span>
        <span id="step3" class="text-sm" style="color:#bbf7d0;">Получите анализ вашего участка</span>
      </div>
    </div>

    <!-- ── Главная кнопка ──────────────────────────────────────────── -->
    <div class="fade-up-4 w-full">
      <button
        id="locationBtn"
        class="btn-pulse w-full flex items-center justify-center gap-3
               rounded-2xl text-white font-bold text-lg
               active:scale-95 transition-transform duration-150 select-none"
        style="background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
               padding: 20px 24px;
               border: none; cursor: pointer;"
        aria-label="Определить геолокацию и отправить в бот"
      >
        <span id="btnIcon" style="font-size: 22px; line-height: 1;">📍</span>
        <span id="btnLabel">Определить локацию</span>
      </button>
    </div>

    <!-- ── Статус (скрыт по умолчанию) ───────────────────────────── -->
    <div id="statusBlock" class="fade-up-4 hidden">
      <p id="statusText" class="text-sm font-medium"></p>
    </div>

    <!-- ── Подпись безопасности ────────────────────────────────────── -->
    <p id="securityNote" class="fade-up-5 text-xs text-center pb-2" style="color:#4ade80; opacity:0.6;">
      🔒 Координаты используются только для анализа вашего участка
    </p>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
